name: Update

# Once a day, and by hand: move bucket/refryt.json to Refryt's latest release, with the hashes
# from that release's SHA256SUMS file, and commit it if anything changed.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Update the manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo gridoe/refryt --json tagName --jq .tagName)"
          version="${tag#v}"
          sums="$(gh release download "$tag" --repo gridoe/refryt --pattern "refryt-$version-SHA256SUMS.txt" --output -)"
          hash() { echo "$sums" | awk -v f="$1" '$2 == f { print $1 }'; }
          x64="$(hash "refryt-$version-windows-x86_64.zip")"
          arm64="$(hash "refryt-$version-windows-arm64.zip")"
          [ -n "$x64" ] && [ -n "$arm64" ] || { echo "::error::no zip hashes in $tag's SHA256SUMS"; exit 1; }
          python3 - "$version" "$x64" "$arm64" <<'PY'
          import json, sys
          version, x64, arm64 = sys.argv[1:4]
          path = "bucket/refryt.json"
          m = json.load(open(path))
          base = f"https://github.com/gridoe/refryt/releases/download/v{version}/refryt-{version}"
          m["version"] = version
          m["architecture"]["64bit"] = {"url": f"{base}-windows-x86_64.zip", "hash": x64}
          m["architecture"]["arm64"] = {"url": f"{base}-windows-arm64.zip", "hash": arm64}
          with open(path, "w") as f:
              json.dump(m, f, indent=4)
              f.write("\n")
          PY
          if git diff --quiet; then
            echo "already at $version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "refryt $version"
          git push
